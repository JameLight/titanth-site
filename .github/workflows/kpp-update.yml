name: Kamphaeng Phet water data

# Updates flood/kamphaeng-phet/data.json and data.js from official public sources:
# RID hourly river levels, DDPM Cell Broadcast (open data), TMD 7-day forecast (open data).
# On main (schedule or manual run) it commits only when the data changed.
# On a pull request it runs as a dry run: tests plus one real fetch, no commit.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/kpp/**"
      - ".github/workflows/kpp-update.yml"
      - "flood/kamphaeng-phet/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: kpp-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the updater
        run: node --test .github/kpp/tests/update.test.mjs
      - name: Fetch official data
        run: node .github/kpp/update.mjs
      - name: Show result
        run: |
          node -e 'const d=require("./flood/kamphaeng-phet/data.json"); console.log("river observed_at", d.river && d.river.observed_at); console.log("alerts", d.alerts && d.alerts.items.length, "forecast", d.forecast && d.forecast.build_at)'
      - name: Commit if the data changed (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- flood/kamphaeng-phet/data.json flood/kamphaeng-phet/data.js; then
            echo "no change"
            exit 0
          fi
          git config user.name "kpp-water-updater"
          git config user.email "kpp-water-updater@users.noreply.github.com"
          git add flood/kamphaeng-phet/data.json flood/kamphaeng-phet/data.js
          git commit -m "Kamphaeng Phet water data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          # ask Pages to rebuild in case a token push does not start a build
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (the push may still trigger a build)"
        env:
          GH_TOKEN: ${{ github.token }}
