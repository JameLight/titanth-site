name: Kamphaeng Phet water data

# Updates flood/kamphaeng-phet/data.json and data.js from official public sources:
# RID hourly river levels, DDPM Cell Broadcast (open data), TMD 7-day forecast (open data).
# On main (schedule or manual run) it commits only when the data changed, or at least every 3 hours.
# On a pull request it runs as a read-only dry run: tests plus one real fetch, no commit.
# Actions are pinned to full commit SHAs.
# GitHub may start scheduled runs late or skip them; the page shows when alerts and forecasts were saved.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/kpp/**"
      - ".github/workflows/kpp-update.yml"
      - "flood/kamphaeng-phet/**"

permissions:
  contents: read

concurrency:
  group: kpp-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test the updater and the page rules
        run: node --test .github/kpp/tests/update.test.mjs .github/kpp/tests/page.test.mjs .github/kpp/tests/page_dom.test.mjs
      - name: Fetch official data (dry run, nothing is committed)
        run: node .github/kpp/update.mjs
      - name: Show result
        run: |
          node -e 'const d=require("./flood/kamphaeng-phet/data.json"); console.log("river observed_at", d.river && d.river.observed_at); console.log("alerts", d.alerts && d.alerts.items.length, "forecast days", d.forecast && d.forecast.days.length)'

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test the updater and the page rules
        run: node --test .github/kpp/tests/update.test.mjs .github/kpp/tests/page.test.mjs .github/kpp/tests/page_dom.test.mjs
      - name: Fetch official data
        run: node .github/kpp/update.mjs
      - name: Show result
        run: |
          node -e 'const d=require("./flood/kamphaeng-phet/data.json"); console.log("river observed_at", d.river && d.river.observed_at); console.log("alerts", d.alerts && d.alerts.items.length, "forecast days", d.forecast && d.forecast.days.length)'
      - name: Commit if the data changed (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- flood/kamphaeng-phet/data.json flood/kamphaeng-phet/data.js; then
            echo "no change"
            exit 0
          fi
          git config user.name "kpp-water-updater"
          git config user.email "kpp-water-updater@users.noreply.github.com"
          git add flood/kamphaeng-phet/data.json flood/kamphaeng-phet/data.js
          git commit -m "Kamphaeng Phet water data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          # Ask Pages to rebuild in case a token push does not start a build, then wait for the build of this commit
          # and fail the job if it errored or did not finish, so a green run means the site was rebuilt.
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "build request not accepted (a build may already be running)"
          for i in $(seq 1 30); do
            latest=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.commit + " " + .status' || echo "unknown unknown")
            echo "pages build: $latest"
            case "$latest" in
              "$sha built") exit 0 ;;
              "$sha errored") echo "pages build errored"; exit 1 ;;
            esac
            sleep 10
          done
          echo "pages build for $sha did not finish in 5 minutes"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
